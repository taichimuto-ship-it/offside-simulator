<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>オフサイドを動かして学ぼう！</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f3f7f5;color:#17342b;margin:0;padding:18px}main{max-width:720px;margin:auto}h1{font-size:1.55rem}p{line-height:1.6}.pitch{width:100%;touch-action:none;border-radius:14px;display:block;box-shadow:0 5px 18px #1234}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}button{border:1px solid #adc3b8;background:white;border-radius:9px;padding:10px 12px;font-weight:600}button:focus-visible{outline:3px solid #327ed9}.panel{background:white;border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 2px 8px #0001}.result{font-size:1.3rem;font-weight:800}.good{color:#087e49}.bad{color:#b34b18}input[type=range]{width:100%;accent-color:#1679cc}label{font-weight:700;display:block;margin-top:12px}.note{font-size:.85rem;color:#49645a}svg .movable{cursor:grab}svg .movable:active{cursor:grabbing}</style></head><body><main><h1>⚽ オフサイドを動かして学ぼう！</h1><p>🔵 A（攻撃）と 🔴 DF（守備）を<strong>指で左右に動かして</strong>みよう。下のスライダーでも操作できるよ。</p><div class="buttons"><button id="reset">基本配置</button><button id="level">同じライン</button><button id="off">オフサイド例</button><button id="own">自陣の例</button></div><svg id="pitch" class="pitch" viewBox="0 0 360 260" aria-label="選手を左右に動かせるサッカーコート"><rect width="360" height="260" fill="#287348"/><g fill="#fff" opacity=".055"><rect width="45" height="260"/><rect x="90" width="45" height="260"/><rect x="180" width="45" height="260"/><rect x="270" width="45" height="260"/></g><g fill="none" stroke="#e5f4e8" stroke-width="1.5"><rect x="10" y="10" width="340" height="240"/><path d="M180 10V250"/><circle cx="180" cy="130" r="34"/><rect x="292" y="62" width="58" height="136"/><rect x="326" y="96" width="24" height="68"/><path d="M350 108h8v44h-8"/></g><rect id="zone" x="254" y="10" width="96" height="240" fill="#ffd25a" opacity=".19"/><line id="line" x1="254" x2="254" y1="10" y2="250" stroke="#ffe47d" stroke-width="3" stroke-dasharray="6 5"/><g fill="white" font-size="11"><text x="20" y="27">自陣</text><text x="192" y="27">相手陣</text><text x="345" y="27" text-anchor="end">攻撃方向 →</text></g><g transform="translate(145 181)"><circle r="13" fill="#167fda" stroke="white" stroke-width="2"/><text y="4" text-anchor="middle" fill="white" font-size="12" font-weight="bold">P</text></g><line id="pass" x1="145" y1="181" x2="225" y2="77" stroke="white" stroke-width="2" stroke-dasharray="4 5"/><g id="df" class="movable" transform="translate(254 115)"><circle r="25" fill="transparent"/><circle r="15" fill="#eb665f" stroke="white" stroke-width="2.5"/><text y="4" text-anchor="middle" fill="white" font-size="11" font-weight="bold" pointer-events="none">DF</text></g><g transform="translate(335 166)"><circle r="13" fill="#ffce56" stroke="white" stroke-width="2"/><text y="4" text-anchor="middle" fill="#3a2a05" font-size="10" font-weight="bold">GK</text></g><g id="att" class="movable" transform="translate(225 77)"><circle r="25" fill="transparent"/><circle r="16" fill="#1285ec" stroke="white" stroke-width="3"/><text y="5" text-anchor="middle" fill="white" font-size="13" font-weight="bold" pointer-events="none">A</text></g></svg><div class="panel" aria-live="polite"><div id="verdict" class="result good">✓ オンサイド</div><p id="reason"></p></div><div class="panel"><label for="attRange">🔵 攻撃選手Aを動かす</label><input id="attRange" type="range" min="20" max="345" value="225"><label for="dfRange">🔴 守備選手DFを動かす</label><input id="dfRange" type="range" min="185" max="320" value="254"></div><p class="note">この図はパスが出る瞬間を表しています。Pがボールを保持し、GKはDFよりゴール側に固定されています。黄色の線は後方から2人目の相手競技者の位置。ラインと同じ位置ならオンサイドです。ポジションにいるだけでは反則にならず、プレーへの関与が必要です。これは基本ルールの学習用で、身体部位や妨害などの詳細判定は省略しています。</p></main><script>const pitch=document.getElementById('pitch'),att=document.getElementById('att'),df=document.getElementById('df'),line=document.getElementById('line'),zone=document.getElementById('zone'),pass=document.getElementById('pass'),ar=document.getElementById('attRange'),dr=document.getElementById('dfRange'),verdict=document.getElementById('verdict'),reason=document.getElementById('reason');let ax=225,dx=254,drag=null;function render(){att.setAttribute('transform',`translate(${ax} 77)`);df.setAttribute('transform',`translate(${dx} 115)`);line.setAttribute('x1',dx);line.setAttribute('x2',dx);zone.setAttribute('x',dx);zone.setAttribute('width',350-dx);pass.setAttribute('x2',ax);ar.value=ax;dr.value=dx;const off=ax>180&&ax>145&&ax>dx;verdict.textContent=off?'⚑ オフサイドポジション':'✓ オンサイド';verdict.className='result '+(off?'bad':'good');reason.textContent=off?'相手陣内で、ボールと後方から2人目の相手競技者の両方よりゴールラインに近い位置だよ。ここでプレーに関与するとオフサイドの反則になるよ。':ax<=180?'自陣にいる選手はオフサイドポジションにならないよ。':Math.abs(ax-dx)<1?'DFと同じライン上だからオンサイド！':'DFのラインより手前だからオンサイド！'}function svgX(e){const pt=pitch.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(pitch.getScreenCTM().inverse()).x}function move(x){if(drag==='a')ax=Math.max(20,Math.min(345,Math.round(x)));if(drag==='d')dx=Math.max(185,Math.min(320,Math.round(x)));render()}pitch.addEventListener('pointerdown',e=>{const a=e.target.closest('#att'),d=e.target.closest('#df');if(!a&&!d)return;drag=a?'a':'d';pitch.setPointerCapture(e.pointerId);move(svgX(e));e.preventDefault()});pitch.addEventListener('pointermove',e=>{if(drag){move(svgX(e));e.preventDefault()}});pitch.addEventListener('pointerup',()=>drag=null);pitch.addEventListener('pointercancel',()=>drag=null);ar.addEventListener('input',e=>{ax=+e.target.value;render()});dr.addEventListener('input',e=>{dx=+e.target.value;render()});document.getElementById('reset').onclick=()=>{ax=225;dx=254;render()};document.getElementById('level').onclick=()=>{ax=254;dx=254;render()};document.getElementById('off').onclick=()=>{ax=290;dx=254;render()};document.getElementById('own').onclick=()=>{ax=140;dx=254;render()};render();</script></body></html>
